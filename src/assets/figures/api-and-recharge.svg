<svg viewBox="0 0 1600 820" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="Roboto, Arial, sans-serif">
  <defs>
    <radialGradient id="ar-core" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#0b4f7d"/>
      <stop offset="1" stop-color="#132a46"/>
    </radialGradient>
  </defs>

  <!-- column A: campus need -->
  <rect x="40" y="20" width="260" height="400" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#00629B" stroke-width="2"/>
  <text x="62" y="54" fill="#00C6D7" font-size="15" letter-spacing="1.5">START WITH A NEED</text>
  <text x="62" y="92" fill="#FFCD00" font-family="Teko, sans-serif" font-size="34">CAMPUS BUILDERS</text>
  <g font-size="20" fill="#ffffff" font-weight="700">
    <rect x="62" y="114" width="216" height="62" rx="10" fill="#ffffff" fill-opacity=".07"/><text x="80" y="152">Department staff</text>
    <rect x="62" y="186" width="216" height="62" rx="10" fill="#ffffff" fill-opacity=".07"/><text x="80" y="224">Research labs</text>
    <rect x="62" y="258" width="216" height="62" rx="10" fill="#ffffff" fill-opacity=".07"/><text x="80" y="296" font-size="17">Administrative analysts</text>
    <rect x="62" y="330" width="216" height="62" rx="10" fill="#ffffff" fill-opacity=".07"/><text x="80" y="368">Faculty teams</text>
  </g>

  <!-- column B: clients -->
  <rect x="330" y="20" width="300" height="400" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#FFCD00" stroke-width="2"/>
  <text x="352" y="54" fill="#00C6D7" font-size="15" letter-spacing="1.5">CONNECT A CLIENT OR APP</text>
  <text x="352" y="92" fill="#FFCD00" font-family="Teko, sans-serif" font-size="38">API CLIENTS</text>
  <rect x="352" y="114" width="256" height="76" rx="10" fill="#FFCD00" fill-opacity=".16" stroke="#FFCD00"/>
  <text x="372" y="146" fill="#ffffff" font-size="21" font-weight="700">TritonAI Harness</text>
  <text x="372" y="174" fill="#c4d2df" font-size="17">Primary supported client</text>
  <rect x="352" y="200" width="256" height="76" rx="10" fill="#ffffff" fill-opacity=".07"/>
  <text x="372" y="232" fill="#ffffff" font-size="21" font-weight="700">Claude Code, Codex</text>
  <text x="372" y="260" fill="#c4d2df" font-size="17">Supported alternatives</text>
  <rect x="352" y="286" width="256" height="76" rx="10" fill="#ffffff" fill-opacity=".07"/>
  <text x="372" y="318" fill="#ffffff" font-size="21" font-weight="700">Hermes, OpenCode</text>
  <text x="372" y="346" fill="#c4d2df" font-size="17">and other compatible clients</text>
  <text x="352" y="398" fill="#c4d2df" font-size="15">Plus n8n workflows and your own code</text>

  <!-- arrow to gateway -->
  <path d="M 640 220 L 676 220" stroke="#00C6D7" stroke-width="4"/>
  <polygon points="694,220 672,208 672,232" fill="#00C6D7"/>

  <!-- gateway core -->
  <circle cx="820" cy="220" r="176" fill="none" stroke="#9fb3c8" stroke-opacity=".25"/>
  <circle cx="820" cy="220" r="150" fill="url(#ar-core)" stroke="#FFCD00" stroke-width="5"/>
  <text x="820" y="160" fill="#00C6D7" font-size="15" letter-spacing="1.5" text-anchor="middle">SHARED API ENDPOINT</text>
  <text x="820" y="216" fill="#ffffff" font-family="Teko, sans-serif" font-size="54" text-anchor="middle">TritonAI LLM</text>
  <text x="820" y="264" fill="#ffffff" font-family="Teko, sans-serif" font-size="54" text-anchor="middle">Gateway</text>
  <text x="820" y="300" fill="#FFCD00" font-size="18" text-anchor="middle">One key per approval</text>

  <!-- access arrow -->
  <path d="M 980 220 L 1026 220" stroke="#00C6D7" stroke-width="4"/>
  <polygon points="1044,220 1022,208 1022,232" fill="#00C6D7"/>
  <rect x="972" y="182" width="72" height="24" rx="12" fill="#182B49" stroke="#9fb3c8" stroke-opacity=".5"/>
  <text x="1008" y="199" fill="#c4d2df" font-size="13" text-anchor="middle" letter-spacing="1">ACCESS</text>

  <!-- column D: models by route -->
  <rect x="1060" y="20" width="500" height="400" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#6f9363" stroke-width="2"/>
  <text x="1082" y="50" fill="#00C6D7" font-size="15" letter-spacing="1.5">MODELS BY APPROVED ROUTE</text>

  <rect x="1078" y="62" width="464" height="154" rx="10" fill="#ffffff" fill-opacity=".07"/>
  <text x="1096" y="88" fill="#ffffff" font-size="18" font-weight="700">UC-hosted <tspan fill="#c4d2df" font-weight="400" font-size="15">· open models on UC San Diego GPUs</tspan></text>
  <g font-size="15" fill="#f5f0e6">
    <text x="1096" y="114">GLM 5.3 · 5.3 Flash</text>
    <text x="1320" y="114">Muse Glimmer 30B</text>
    <text x="1096" y="138">Qwen3 Embedding 4B</text>
    <text x="1320" y="138">Cohere Transcribe</text>
    <text x="1096" y="162">OpenAI Privacy Filter</text>
  </g>
  <rect x="1090" y="174" width="440" height="32" rx="8" fill="#FFCD00" fill-opacity=".14" stroke="#FFCD00" stroke-opacity=".8"/>
  <text x="1104" y="195" fill="#ffffff" font-size="15" font-weight="700">H2O Lightning 4B <tspan fill="#c4d2df" font-weight="400">· new classification model</tspan></text>
  <rect x="1446" y="181" width="74" height="18" rx="9" fill="none" stroke="#FFCD00"/>
  <text x="1483" y="194" fill="#FFCD00" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">TESTING</text>

  <rect x="1078" y="226" width="464" height="130" rx="10" fill="#ffffff" fill-opacity=".07"/>
  <text x="1096" y="252" fill="#ffffff" font-size="18" font-weight="700">Enterprise cloud <tspan fill="#c4d2df" font-weight="400" font-size="15">· AWS, Azure, Google Vertex AI</tspan></text>
  <g font-size="15" fill="#f5f0e6">
    <text x="1096" y="280">Claude 5.5 · Haiku · Sonnet · Opus</text>
    <text x="1096" y="304">GPT 6 · 6.1 Sol · 6 Astra · 6 Luna</text>
    <text x="1096" y="328">Gemini 4 Argon · Gemma 4 31B · Kimi K2.6</text>
  </g>
  <text x="1082" y="382" fill="#00C6D7" font-size="13" letter-spacing="1.5">CAPABILITIES VARY BY MODEL</text>
  <text x="1082" y="406" fill="#c4d2df" font-size="15">Chat · Reasoning · Vision · Coding · OCR · Speech · Images</text>

  <!-- recharge -->
  <text x="40" y="490" fill="#FFCD00" font-family="Teko, sans-serif" font-size="42">WHAT A KEY COSTS</text>
  <text x="360" y="488" fill="#c4d2df" font-size="19">Recharge is the campus term for internal billing to a department chartstring.</text>
  <g>
    <rect x="40" y="512" width="365" height="226" rx="16" fill="#1f6f4a" fill-opacity=".35" stroke="#1f6f4a"/>
    <text x="64" y="556" fill="#ffffff" font-size="22" font-weight="700">Campus work</text>
    <text x="64" y="598" fill="#e8fff2" font-family="Teko, sans-serif" font-size="40">NO RECHARGE</text>
    <text x="64" y="636" fill="#c4d2df" font-size="18">UC-hosted models for campus</text>
    <text x="64" y="662" fill="#c4d2df" font-size="18">administrative work.</text>
    <text x="64" y="700" fill="#c4d2df" font-size="18">Monthly caps apply.</text>

    <rect x="425" y="512" width="365" height="226" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#FFCD00" stroke-opacity=".7"/>
    <text x="449" y="556" fill="#ffffff" font-size="22" font-weight="700">Cloud models</text>
    <text x="449" y="598" fill="#FFCD00" font-family="Teko, sans-serif" font-size="40">FROM THE FIRST TOKEN</text>
    <text x="449" y="636" fill="#c4d2df" font-size="18">Billed to a department chartstring</text>
    <text x="449" y="662" fill="#c4d2df" font-size="18">at the Model Hub rate, with a</text>
    <text x="449" y="688" fill="#c4d2df" font-size="18">budget owner and spend limit.</text>

    <rect x="810" y="512" width="365" height="226" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#00C6D7" stroke-opacity=".7"/>
    <text x="834" y="556" fill="#ffffff" font-size="22" font-weight="700">Grant research</text>
    <text x="834" y="598" fill="#00C6D7" font-family="Teko, sans-serif" font-size="40">TO THE GRANT</text>
    <text x="834" y="636" fill="#c4d2df" font-size="18">UC-hosted and cloud use charged</text>
    <text x="834" y="662" fill="#c4d2df" font-size="18">to the grant or approved project</text>
    <text x="834" y="688" fill="#c4d2df" font-size="18">chartstring.</text>

    <rect x="1195" y="512" width="365" height="226" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#9fb3c8" stroke-opacity=".6"/>
    <text x="1219" y="556" fill="#ffffff" font-size="22" font-weight="700">Other UC campuses</text>
    <text x="1219" y="598" fill="#c4d2df" font-family="Teko, sans-serif" font-size="34">INTERCAMPUS RECHARGE</text>
    <text x="1219" y="636" fill="#c4d2df" font-size="18">Connect through an agreement</text>
    <text x="1219" y="662" fill="#c4d2df" font-size="18">arranged with the TritonAI team.</text>
  </g>
  <text x="40" y="788" fill="#9fb3c8" font-size="18">Your approval sets routes, limits, and billing; full model list and rates are in the Model Hub. Your app still owns data permissions, testing, and human review. tritonai.ucsd.edu/developer-apis</text>
</svg>
