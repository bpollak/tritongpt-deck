<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="Roboto, Arial, sans-serif">
  <!-- steps -->
  <g>
    <rect x="40" y="40" width="460" height="250" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#00C6D7" stroke-opacity=".6"/>
    <circle cx="104" cy="104" r="36" fill="#FFCD00"/>
    <text x="104" y="120" fill="#182B49" font-family="Teko, sans-serif" font-size="50" text-anchor="middle">1</text>
    <text x="160" y="116" fill="#ffffff" font-family="Teko, sans-serif" font-size="40">GET A KEY</text>
    <text x="70" y="186" fill="#f5f0e6" font-size="22">Request a TritonAI Gateway key.</text>
    <text x="70" y="220" fill="#c4d2df" font-size="19">One key works in the Harness,</text>
    <text x="70" y="246" fill="#c4d2df" font-size="19">Claude Code, Codex, and other clients.</text>

    <path d="M 512 165 L 556 165" stroke="#FFCD00" stroke-width="4"/>
    <polygon points="572,165 552,154 552,176" fill="#FFCD00"/>

    <rect x="570" y="40" width="460" height="250" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#00C6D7" stroke-opacity=".6"/>
    <circle cx="634" cy="104" r="36" fill="#FFCD00"/>
    <text x="634" y="120" fill="#182B49" font-family="Teko, sans-serif" font-size="50" text-anchor="middle">2</text>
    <text x="690" y="116" fill="#ffffff" font-family="Teko, sans-serif" font-size="40">INSTALL THE HARNESS</text>
    <text x="600" y="186" fill="#f5f0e6" font-size="22">Stable builds for macOS on Apple</text>
    <text x="600" y="214" fill="#f5f0e6" font-size="22">Silicon and Windows x64.</text>
    <text x="600" y="250" fill="#c4d2df" font-size="19">Updates from Settings, About.</text>

    <path d="M 1042 165 L 1086 165" stroke="#FFCD00" stroke-width="4"/>
    <polygon points="1102,165 1082,154 1082,176" fill="#FFCD00"/>

    <rect x="1100" y="40" width="460" height="250" rx="20" fill="#FFCD00" fill-opacity=".1" stroke="#FFCD00" stroke-width="2"/>
    <circle cx="1164" cy="104" r="36" fill="#FFCD00"/>
    <text x="1164" y="120" fill="#182B49" font-family="Teko, sans-serif" font-size="50" text-anchor="middle">3</text>
    <text x="1220" y="116" fill="#ffffff" font-family="Teko, sans-serif" font-size="40">TAKE ESSENTIALS</text>
    <text x="1130" y="186" fill="#f5f0e6" font-size="22">About 8 minutes, with practice</text>
    <text x="1130" y="214" fill="#f5f0e6" font-size="22">files. Then try one real task.</text>
    <text x="1130" y="250" fill="#c4d2df" font-size="19">Full course: about 24 minutes.</text>
  </g>

  <!-- go further -->
  <g>
    <rect x="40" y="330" width="745" height="250" rx="20" fill="#ffffff" fill-opacity=".05"/>
    <text x="70" y="384" fill="#00C6D7" font-family="Teko, sans-serif" font-size="38">BUILD THE FIRST ONE</text>
    <g font-size="21" fill="#f5f0e6">
      <text x="70" y="430">Plan your first project: one workflow, tested</text>
      <text x="70" y="466">Keep a person checking the results</text>
      <text x="70" y="502">Reuse the Skills Library and Developer FAQs</text>
      <text x="70" y="538">Plan ownership and hosting before it's real</text>
    </g>

    <rect x="815" y="330" width="745" height="250" rx="20" fill="#ffffff" fill-opacity=".05"/>
    <text x="845" y="384" fill="#FFCD00" font-family="Teko, sans-serif" font-size="38">GO DEEPER</text>
    <text x="845" y="432" fill="#ffffff" font-size="24" font-weight="700">TritonAI webinar · Thursday, November 12</text>
    <text x="845" y="466" fill="#c4d2df" font-size="20">Every supported tool in depth, citizen developer</text>
    <text x="845" y="492" fill="#c4d2df" font-size="20">use cases, and where AI services are headed</text>
    <text x="845" y="540" fill="#f5f0e6" font-size="20">Course or lab compute: parasol@ucsd.edu</text>
  </g>

  <!-- urls -->
  <g font-family="Teko, sans-serif" font-size="52">
    <text x="420" y="690" fill="#FFCD00" text-anchor="middle">tritonai.ucsd.edu</text>
    <text x="1180" y="690" fill="#00C6D7" text-anchor="middle">parasol.ucsd.edu</text>
  </g>
  <g font-size="18" fill="#9fb3c8" text-anchor="middle">
    <text x="420" y="724">Tools, the Harness, training, Connect, updates</text>
    <text x="1180" y="724">Datahub, GPUs, reservations, documentation</text>
  </g>
</svg>
