<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="Roboto, Arial, sans-serif">
  <!-- quarter demand chart (illustrative shape) -->
  <text x="40" y="44" fill="#00C6D7" font-family="Teko, sans-serif" font-size="40">GPU DEMAND ACROSS A QUARTER</text>
  <text x="40" y="74" fill="#9fb3c8" font-size="17">Illustrative shape, from the PARASOL reservation guidance</text>

  <!-- baseline -->
  <line x1="40" y1="430" x2="1000" y2="430" stroke="#9fb3c8" stroke-opacity=".5"/>
  <!-- peak band -->
  <rect x="482" y="96" width="518" height="334" rx="10" fill="#FFCD00" fill-opacity=".08"/>
  <text x="741" y="122" fill="#FFCD00" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1">PEAK · COURSEWORK FIRST</text>

  <!-- bars: weeks 1-10 + finals -->
  <g>
    <rect x="52"  y="370" width="62" height="60" rx="6" fill="#00629B"/>
    <rect x="138" y="352" width="62" height="78" rx="6" fill="#00629B"/>
    <rect x="224" y="330" width="62" height="100" rx="6" fill="#00629B"/>
    <rect x="310" y="306" width="62" height="124" rx="6" fill="#00629B"/>
    <rect x="396" y="282" width="62" height="148" rx="6" fill="#00629B"/>
    <rect x="482" y="226" width="62" height="204" rx="6" fill="#FFCD00"/>
    <rect x="568" y="202" width="62" height="228" rx="6" fill="#FFCD00"/>
    <rect x="654" y="188" width="62" height="242" rx="6" fill="#FFCD00"/>
    <rect x="740" y="164" width="62" height="266" rx="6" fill="#FFCD00"/>
    <rect x="826" y="150" width="62" height="280" rx="6" fill="#FFCD00"/>
    <rect x="912" y="140" width="80" height="290" rx="6" fill="#FC8900"/>
  </g>
  <g fill="#c4d2df" font-size="17" text-anchor="middle">
    <text x="83" y="458">1</text><text x="169" y="458">2</text><text x="255" y="458">3</text><text x="341" y="458">4</text>
    <text x="427" y="458">5</text><text x="513" y="458">6</text><text x="599" y="458">7</text><text x="685" y="458">8</text>
    <text x="771" y="458">9</text><text x="857" y="458">10</text><text x="952" y="458">Finals</text>
  </g>
  <text x="40" y="490" fill="#9fb3c8" font-size="17">Week of quarter</text>

  <!-- how reservations work -->
  <g>
    <rect x="40" y="524" width="470" height="196" rx="16" fill="#ffffff" fill-opacity=".07"/>
    <text x="66" y="568" fill="#FFCD00" font-family="Teko, sans-serif" font-size="32">RESERVE A WINDOW</text>
    <text x="66" y="602" fill="#f5f0e6" font-size="19">A reservation holds a GPU for a set time,</text>
    <text x="66" y="628" fill="#f5f0e6" font-size="19">so a student with a deadline doesn't wait.</text>

    <rect x="530" y="524" width="470" height="196" rx="16" fill="#ffffff" fill-opacity=".07"/>
    <text x="556" y="568" fill="#00C6D7" font-family="Teko, sans-serif" font-size="32">RUN LONG JOBS OFF-PEAK</text>
    <text x="556" y="602" fill="#f5f0e6" font-size="19">Nights, weekends, and early weeks cost</text>
    <text x="556" y="628" fill="#f5f0e6" font-size="19">fewer Service Units, so research shifts</text>
    <text x="556" y="654" fill="#f5f0e6" font-size="19">to when classes use the fewest GPUs.</text>
    <text x="66" y="684" fill="#c4d2df" font-size="17">The School books first; an unbooked hour</text>
    <text x="66" y="706" fill="#c4d2df" font-size="17">opens to campus over the 12 hours before it.</text>
  </g>

  <!-- numbers -->
  <g>
    <rect x="1060" y="96" width="500" height="160" rx="18" fill="#FFCD00" fill-opacity=".12" stroke="#FFCD00" stroke-opacity=".7"/>
    <text x="1090" y="178" fill="#FFCD00" font-family="Teko, sans-serif" font-size="84">66,800</text>
    <text x="1090" y="222" fill="#f5f0e6" font-size="20">peak GPU-hours a year for coursework</text>

    <rect x="1060" y="276" width="500" height="160" rx="18" fill="#00C6D7" fill-opacity=".1" stroke="#00C6D7" stroke-opacity=".7"/>
    <text x="1090" y="358" fill="#00C6D7" font-family="Teko, sans-serif" font-size="84">213,000+</text>
    <text x="1090" y="402" fill="#f5f0e6" font-size="20">off-peak GPU-hours for research and grad work</text>

    <rect x="1060" y="456" width="500" height="264" rx="18" fill="#ffffff" fill-opacity=".06"/>
    <text x="1090" y="498" fill="#9fb3c8" font-size="17" letter-spacing="2">WHO IT ALREADY SERVES · AY 2025–26</text>
    <g font-family="Teko, sans-serif" fill="#ffffff" font-size="54">
      <text x="1090" y="566">140+</text><text x="1320" y="566">75</text>
      <text x="1090" y="664">18,000</text><text x="1320" y="664">500+</text>
    </g>
    <g fill="#c4d2df" font-size="18">
      <text x="1090" y="594">classes</text><text x="1320" y="594">instructors</text>
      <text x="1090" y="692">student enrollments</text><text x="1320" y="692">campus researchers</text>
    </g>
  </g>
</svg>
